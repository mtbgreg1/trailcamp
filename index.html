<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1e2a32">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>Trailcamp</title>
<link rel="stylesheet" href="lib/leaflet.min.css">
<script src="lib/leaflet.min.js"></script>
<script src="lib/pako_inflate.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; overflow-x: hidden; }
  #app { display: flex; flex-direction: column; height: 100%; max-width: 100%; overflow-x: hidden; }

  header {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: calc(env(safe-area-inset-top, 0px) + 8px) 10px 8px;
    background: #1e2a32; color: #fff; z-index: 1200; user-select: none; -webkit-user-select: none;
    max-width: 100%; overflow-x: hidden;
  }
  header > * { min-width: 0; }
  header h1 { font-size: 16px; margin: 0 4px 0 0; font-weight: 600; }
  .seg { display: flex; border-radius: 7px; overflow: hidden; border: 1px solid #46606f; }
  .seg button {
    background: transparent; color: #cfe3ee; border: 0; padding: 8px 11px;
    cursor: pointer; font-size: 13px; min-height: 36px;
  }
  .seg button.active { background: #fec200; color: #1e2a32; font-weight: 600; }
  .btn {
    background: #34495e; color: #fff; border: 1px solid #46606f; border-radius: 7px;
    padding: 8px 12px; font-size: 13px; cursor: pointer; min-height: 36px;
  }
  .btn.primary { background: #fec200; color: #1e2a32; border-color: #fec200; font-weight: 600; }
  /* full-width own row: keeps the header from ever exceeding the screen width,
     which is what made focusing the field scroll the whole header sideways */
  #searchBox {
    padding: 8px 10px; border-radius: 7px; border: 1px solid #46606f;
    background: #2b3d49; color: #fff; font-size: 16px;
    flex: 1 1 100%; min-width: 0; width: 100%; max-width: 100%; min-height: 36px;
  }
  #searchBox::placeholder { color: #8fa6b3; }
  #placeCount { font-size: 11px; color: #9fb7c4; width: 100%; }

  #main { flex: 1; display: flex; position: relative; min-height: 0; }

  /* Sidebar (filters) — slide-over drawer */
  #sidebarBackdrop {
    position: absolute; inset: 0; z-index: 1400; background: rgba(0,0,0,.35); display: none;
  }
  #sidebarBackdrop.open { display: block; }
  #sidebar {
    position: absolute; top: 0; bottom: 0; left: 0; width: 82%; max-width: 320px;
    background: #f4f6f7; border-right: 1px solid #d8dee1;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 12px 12px calc(env(safe-area-inset-bottom, 0px) + 12px);
    z-index: 1500; transform: translateX(-105%); transition: transform .22s ease;
  }
  #sidebar.open { transform: translateX(0); }
  #sidebar h3 { font-size: 12px; text-transform: uppercase; color: #667; margin: 4px 0 8px; }
  .cat-row { display: flex; align-items: center; gap: 8px; padding: 7px 2px; font-size: 14px; cursor: pointer; }
  .cat-row input { width: 18px; height: 18px; }
  .cat-row .dot {
    width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(0,0,0,.25);
    display: flex; align-items: center; justify-content: center; font-size: 12px; line-height: 1;
  }
  .cat-row .cnt { margin-left: auto; color: #889; font-size: 12px; }
  .sidebar-actions { display: flex; gap: 6px; margin-bottom: 8px; }
  .sidebar-actions button { flex: 1; font-size: 13px; padding: 8px 4px; cursor: pointer; border: 1px solid #c6ced2; background: #fff; border-radius: 6px; min-height: 36px; }
  .sidebar-actions button.on { background: #fec200; border-color: #e0ab00; font-weight: 600; }

  /* iOverlander-style glyph pins */
  .pin-ico {
    display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.45);
    font-size: 13px; line-height: 1;
  }
  /* Planet Fitness: their brand colours (purple + yellow) rendered as a "PF"
     monogram. Deliberately NOT their actual logo file — same approach taken
     with the iOverlander category icons, and it stays legible at 26px. */
  .pin-ico.pf, .dot.pf, .pcat.pf { color: #F1EB43; font-weight: 800; letter-spacing: .3px; }
  .pin-ico.pf { font-size: 11px; }
  .dot.pf { font-size: 10px; }
  #dataInfo { font-size: 11px; color: #99a; margin-top: 14px; line-height: 1.5; }

  /* Map panes */
  #viewCombined, #viewTF, #viewGM { position: absolute; inset: 0; }
  #viewTF, #viewGM { display: none; }
  #mapMain { position: absolute; inset: 0; }

  /* TF / GM views: iframe underneath, transparent leaflet on top */
  #tfFrames, #gmFrames {
    position: absolute; inset: 0; transform-origin: 50% 50%;
    will-change: transform;
  }
  .tf-frame {
    position: absolute; left: -25%; top: -25%; width: 150%; height: 150%;
    border: 0; opacity: 0; transition: opacity .25s;
    pointer-events: none;
  }
  .tf-frame.shown { opacity: 1; pointer-events: auto; }
  .tf-frame.fit { left: 0; top: 0; width: 100%; height: 100%; }
  #mapTF, #mapGM { position: absolute; inset: 0; background: transparent !important; }
  #mapTF.pass-through, #mapGM.pass-through { pointer-events: none; }
  #mapTF .leaflet-tile-pane, #mapGM .leaflet-tile-pane { display: none; }

  #tfCrosshair, #gmCrosshair {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    pointer-events: none; z-index: 900; opacity: .55; font-size: 18px; color: #1e2a32;
    text-shadow: 0 0 3px #fff;
  }
  /* compact per-view control bars in the header area (horizontally scrollable) */
  .subbar {
    display: none; align-items: center; gap: 6px; padding: 6px 10px;
    background: #16232c; color: #fff; font-size: 12px; z-index: 1150;
    overflow-x: auto; -webkit-overflow-scrolling: touch; white-space: nowrap;
  }
  .subbar.show { display: flex; }
  .subbar > * { flex-shrink: 0; }
  .subbar .btn { padding: 5px 9px; font-size: 12px; min-height: 30px; }
  .subbar select {
    background: #2b3d49; color: #fff; border: 1px solid #46606f;
    border-radius: 5px; font-size: 13px; padding: 4px; min-height: 30px;
  }
  .subbar input {
    background: #2b3d49; color: #fff; border: 1px solid #46606f;
    border-radius: 5px; font-size: 16px; padding: 3px 6px; min-height: 30px;
  }
  .subbar a { color: #fec200; }
  #tfLayersPanel {
    display: none; position: absolute; top: 8px; left: 8px; z-index: 1600;
    background: rgba(30,42,50,.97); border: 1px solid #46606f; border-radius: 8px;
    padding: 8px 12px; white-space: nowrap; text-align: left; color: #fff;
  }
  #tfLayersPanel.open { display: block; }
  #tfLayersPanel label { display: block; font-size: 14px; padding: 6px 0; cursor: pointer; }
  #tfLayersPanel input { width: 17px; height: 17px; vertical-align: middle; }
  #tfSyncBadge, #gmSyncBadge { color: #fec200; display: none; }
  #tfHint {
    position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); left: 50%; transform: translateX(-50%);
    background: rgba(254,194,0,.95); color: #1e2a32; border-radius: 8px; padding: 7px 14px;
    z-index: 1000; font-size: 13px; font-weight: 600; display: none; text-align: center; max-width: 92%;
  }
  .mtb-boost { filter: saturate(1.9) contrast(1.15); }

  /* Locate-me button */
  .locate-ctl {
    background: #fff; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
    font-size: 19px; cursor: pointer; border-radius: 4px;
  }
  /* bigger leaflet zoom buttons for touch */
  .leaflet-touch .leaflet-bar a { width: 34px; height: 34px; line-height: 34px; }

  .leaflet-popup-content { font-size: 14px; margin: 10px 14px; }
  .leaflet-popup-content .pcat { display: inline-block; padding: 1px 7px; border-radius: 9px; color: #fff; font-size: 11px; margin-bottom: 4px; }
  .leaflet-popup-content .pdesc { max-height: 150px; overflow-y: auto; -webkit-overflow-scrolling: touch; white-space: pre-wrap; color: #445; }
  /* ---- translated descriptions ---- */
  .leaflet-popup-content .ptrans { font-size: 11px; color: #8794a0; margin-top: 3px; line-height: 1.5; }
  .leaflet-popup-content .ptrans .tlink { color: #2f6fb0; cursor: pointer; border-bottom: 1px dotted #9fb4c6; }
  .leaflet-popup-content .ptrans .tlink:active { opacity: .55; }
  .leaflet-popup-content .porig { display: none; max-height: 130px; overflow-y: auto; -webkit-overflow-scrolling: touch; white-space: pre-wrap; color: #6b7580; font-size: 13px; margin-top: 4px; padding-top: 4px; border-top: 1px solid #e3e7ec; }

  /* ---- location typeahead ---- */
  .ac-list {
    position: fixed; z-index: 3600; display: none;
    background: #fff; border-radius: 10px;
    overflow-x: hidden; overflow-y: auto;
    box-shadow: 0 8px 28px rgba(0,0,0,.35); max-height: 46vh;
    -webkit-overflow-scrolling: touch; font-size: 14px;
    touch-action: pan-y;                 /* let a thumb drag scroll the list */
    overscroll-behavior: contain;        /* don't chain the scroll to the map */
  }
  .ac-list.open { display: block; }
  .ac-item {
    display: flex; align-items: center; gap: 10px; padding: 11px 12px;
    cursor: pointer; border-bottom: 1px solid #eceff1; min-height: 46px;
    touch-action: pan-y;
  }
  .ac-item:last-child { border-bottom: 0; }
  /* fade over the half-visible row: signals "there's more, scroll me" */
  .ac-fade {
    position: sticky; bottom: 0; height: 38px; margin-top: -38px;
    pointer-events: none; display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 2px; font-size: 13px; color: #78909c;
    background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,.72) 45%, rgba(255,255,255,.94) 100%);
  }
  .ac-list:not(.more) .ac-fade { display: none; }
  .ac-item.sel, .ac-item:hover { background: #fff8e1; }
  .ac-ico {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 14px;
    background: #eceff1;
  }
  .ac-ico.local { background: #fec200; }
  .ac-ico.trail { background: #c8e6c9; }
  .ac-txt { min-width: 0; flex: 1; }
  .ac-name { color: #1e2a32; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ac-sub { color: #78909c; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ac-note { padding: 9px 12px; color: #90a4ae; font-size: 12.5px; }

  #toast {
    position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); left: 50%; transform: translateX(-50%);
    z-index: 3000; background: #1e2a32; color: #fff;
    padding: 10px 16px; border-radius: 8px; font-size: 13px; display: none; max-width: 88%;
  }

  /* Boot / loading overlay */
  #loading {
    position: fixed; inset: 0; z-index: 4000; background: #1e2a32; color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  }
  #loading .logo { font-size: 46px; }
  #loading .msg { font-size: 14px; color: #9fb7c4; }
  #loadBar { width: 220px; height: 6px; background: #34495e; border-radius: 3px; overflow: hidden; }
  #loadBar > div { height: 100%; width: 0; background: #fec200; transition: width .3s; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🚵🏕️ Trailcamp</h1>
    <div class="seg">
      <button id="tabTF" class="active">Trailforks</button>
      <button id="tabGM">Google</button>
      <button id="tabCombined">OSM</button>
    </div>
    <button class="btn" id="filterBtn">Filters</button>
    <button class="btn" id="osmToggle" title="Public campsites from OpenStreetMap for the visible area">OSM: OFF</button>
    <button class="btn" id="routeBtn" title="Plan a driving route and filter campsites along it">Route</button>
    <input id="searchBox" placeholder="Search place…" autocomplete="off">
    <span id="placeCount"></span>
  </header>

  <div id="tfBar" class="subbar">
    <button class="btn" id="tfInteract">Tap trails: OFF</button>
    <select id="tfBasemap" title="Trailforks basemap">
      <option value="trailforks">Topo</option>
      <option value="trailforks-streets">Streets</option>
      <option value="trailforks-dark">Dark</option>
      <option value="satellite">Satellite</option>
      <option value="hybrid">Hybrid</option>
      <option value="arc-world_imagery">Arc Imagery</option>
      <option value="osm">OSM</option>
    </select>
    <select id="tfTrailstyle" title="How trails are colored">
      <option value="difficulty">Difficulty</option>
      <option value="status">Status</option>
      <option value="condition">Condition</option>
      <option value="random">Colors</option>
      <option value="popularity">Popularity</option>
    </select>
    <select id="tfActivity" title="Activity type">
      <option value="1">MTB</option>
      <option value="2">E-Bike</option>
      <option value="19">Gravel</option>
      <option value="18">Adaptive</option>
      <option value="17">Fat Bike</option>
      <option value="9">Horse</option>
      <option value="6">Hike</option>
      <option value="5">Trail Run</option>
      <option value="7">Moto</option>
      <option value="14">Trials</option>
      <option value="8">ATV/OHV</option>
      <option value="15">Snowmobile</option>
      <option value="10">Snowshoe</option>
      <option value="11">DH Ski</option>
      <option value="12">BC Ski</option>
      <option value="13">Nordic</option>
      <option value="0">All</option>
    </select>
    <button class="btn" id="tfLayersBtn">Layers ▾</button>
    <span id="tfSyncBadge">⟳</span>
    <input id="tfRid" placeholder="rid…" style="width:70px" title="Trailforks region ID — trails render at every zoom when set">
    <a href="https://www.trailforks.com/widgets/config/region_map/" target="_blank" title="Pick your region, then copy rid=NUMBER from that page's URL">find</a>
  </div>

  <div id="gmBar" class="subbar">
    <select id="gmBasemap" title="Google basemap">
      <option value="m">Map</option>
      <option value="k">Satellite</option>
      <option value="h">Hybrid</option>
    </select>
    <button class="btn" id="gmInteract">Interact: OFF</button>
    <span id="gmSyncBadge">⟳</span>
  </div>

  <div id="routeBar" class="subbar">
    <input id="routeStart" placeholder="Start ('me' = GPS)" style="width:128px" autocomplete="off">
    <input id="routeEnd" placeholder="End" style="width:110px" autocomplete="off">
    <button class="btn primary" id="routeGo">Route</button>
    <select id="routeCorridor" title="Show only pins within this distance of the route">
      <option value="0">All pins</option>
      <option value="5">±5 mi</option>
      <option value="10">±10 mi</option>
      <option value="25">±25 mi</option>
    </select>
    <button class="btn" id="routeClear">Clear</button>
    <span id="routeInfo"></span>
  </div>

  <div id="main">
    <div id="sidebarBackdrop"></div>
    <div id="sidebar">
      <h3>Quick filters</h3>
      <div class="sidebar-actions">
        <button id="megaCamps">⛺ Campsites</button>
        <button id="megaAll">All POIs</button>
        <button id="megaNone">No POIs</button>
      </div>
      <h3>Categories</h3>
      <div id="catList"></div>
      <div id="dataInfo"></div>
    </div>

    <div style="position:relative; flex:1;">
      <div id="viewCombined">
        <div id="mapMain"></div>
      </div>

      <div id="viewTF">
        <div id="tfFrames">
          <iframe id="tfFrameA" class="tf-frame" title="Trailforks map"></iframe>
          <iframe id="tfFrameB" class="tf-frame" title="Trailforks map"></iframe>
        </div>
        <div id="mapTF"></div>
        <div id="tfCrosshair">✛</div>
        <div id="tfLayersPanel">
          <label><input type="checkbox" value="trail"> Trail heads</label>
          <label><input type="checkbox" value="labels" checked> Trail labels</label>
          <label><input type="checkbox" value="route"> Routes</label>
          <label><input type="checkbox" value="photo"> Photos</label>
          <label><input type="checkbox" value="poi" checked> POIs</label>
          <label><input type="checkbox" value="polygon" checked> Polygons</label>
          <label><input type="checkbox" value="directory" checked> Places</label>
          <label><input type="checkbox" value="region" checked> Regions</label>
          <label><input type="checkbox" value="winter"> Winter only</label>
        </div>
        <div id="tfHint"></div>
      </div>

      <div id="viewGM">
        <div id="gmFrames">
          <iframe id="gmFrameA" class="tf-frame" title="Google map"></iframe>
          <iframe id="gmFrameB" class="tf-frame" title="Google map"></iframe>
        </div>
        <div id="mapGM"></div>
        <div id="gmCrosshair">✛</div>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>
<div id="loading">
  <div class="logo">🚵 🏕️</div>
  <div class="msg" id="loadMsg">Loading places…</div>
  <div id="loadBar"><div></div></div>
</div>

<script>
"use strict";

/* ---------------- state ----------------
   places: array of compact records [name, lat, lng, category, desc, dateVerified]
   Non-English records carry two extra fields: [6] English translation, [7] source
   language code (e.g. "pt"). Records already in English stay 6 long. */
var places = [];
var activeCats = null;               // Set of enabled categories (null = all)
var DATA_VERSION = "iOverlander export 2026-07";
/* Planet Fitness layer: harvested from Planet Fitness's own club directory and
   their public locations.json feed. Bump PF_UPDATED whenever data/planetfitness
   .json.gz is regenerated — it's shown in the sidebar so the age is visible. */
var PF_CAT = "Planet Fitness";
var PF_UPDATED = "2026-08-04";
var DATA_FILES = ["data/usa.json.gz", "data/canada.json.gz", "data/mexico.json.gz",
                  "data/camerica.json.gz", "data/samerica1.json.gz", "data/samerica2.json.gz",
                  "data/planetfitness.json.gz",
                  "data/campgrounds.json.gz", "data/usfsdispersed.json.gz"];
var VIEW_KEY = "tc_view_v1", CATS_KEY = "tc_cats_v1", POS_KEY = "tc_pos_v1";
var P_NAME = 0, P_LAT = 1, P_LNG = 2, P_CAT = 3, P_DESC = 4, P_DATE = 5,
    P_TDESC = 6, P_TLANG = 7;   // baked-in English translation + source language code

var CAT_COLORS = {
  "wild camping": "#2e8b57",
  "informal campsite": "#7cb342",
  "established campground": "#00796b",
  "public campgrounds": "#00838f",
  "usfs dispersed": "#33691e",
  "water": "#1976d2",
  "showers": "#8e24aa",
  "laundromat": "#ab47bc",
  "sanitation dump station": "#8d6e63",
  "mechanic and parts": "#f57c00",
  "fuel station": "#e53935",
  "propane": "#d84315",
  "wifi": "#00acc1",
  "restaurant": "#c2185b",
  "warning": "#d32f2f",
  "checkpoint": "#5d4037",
  "tourist attraction": "#3949ab",
  "short-term parking": "#607d8b",
  "hotel": "#6a1b9a",
  "overnight prohibited": "#b71c1c",
  "planet fitness": "#7B2D8E"
};
var PALETTE = ["#546e7a","#26a69a","#ef6c00","#5c6bc0","#9ccc65","#ec407a","#78909c","#7e57c2"];
function catColor(cat) {
  var k = (cat || "other").toLowerCase();
  if (CAT_COLORS[k]) return CAT_COLORS[k];
  var h = 0; for (var i = 0; i < k.length; i++) h = (h * 31 + k.charCodeAt(i)) >>> 0;
  return PALETTE[h % PALETTE.length];
}

/* Category glyphs matching iOverlander's category legend (ioverlander.com/legend) */
var CAT_ICONS = {
  "wild camping": "⛺",
  "informal campsite": "⛺",
  "established campground": "🏕️",
  "public campgrounds": "🏕️",
  "usfs dispersed": "⛺",
  "farm & vineyard camping": "🍇",
  "hotel": "🛏️",
  "hostel": "🏠",
  "fuel station": "⛽",
  "propane": "🔥",
  "mechanic and parts": "🔧",
  "water": "💧",
  "sanitation dump station": "🚽",
  "short-term parking": "🅿️",
  "eco-friendly": "♻️",
  "restaurant": "🍽️",
  "tourist attraction": "📷",
  "shopping": "🛒",
  "financial": "💵",
  "wifi": "📶",
  "medical": "🏥",
  "pet services": "🐾",
  "laundromat": "🧺",
  "showers": "🚿",
  "customs and immigration": "🛂",
  "checkpoint": "🚓",
  "consulate / embassy": "🏛️",
  "vehicle insurance": "📋",
  "vehicle shipping": "🚢",
  "vehicle storage": "🚗",
  "road report": "🚧",
  "warning": "⚠️",
  "overnight prohibited": "🚫",
  "planet fitness": "PF",
  "other": "📍"
};
function catIcon(cat) {
  return CAT_ICONS[(cat || "other").toLowerCase()] || "📍";
}
/* Planet Fitness draws a "PF" monogram rather than an emoji glyph, so it needs
   the extra class that colours the text yellow. */
function catExtraClass(cat) {
  return (cat || "").toLowerCase() === "planet fitness" ? " pf" : "";
}
/* cached L.divIcon per category */
var iconCache = {};
function makeIcon(cat) {
  var k = (cat || "other").toLowerCase();
  if (iconCache[k]) return iconCache[k];
  iconCache[k] = L.divIcon({
    className: "",
    html: '<div class="pin-ico' + catExtraClass(cat) + '" style="background:' + catColor(cat) + '">' + catIcon(cat) + "</div>",
    iconSize: [26, 26],
    iconAnchor: [13, 13],
    popupAnchor: [0, -15]
  });
  return iconCache[k];
}

/* ---------------- bundled data loading ---------------- */
function setLoad(msg, frac) {
  document.getElementById("loadMsg").textContent = msg;
  document.querySelector("#loadBar > div").style.width = Math.round(frac * 100) + "%";

function rebuildGrid() {
  grid = {};

    var p = places[i];
    var k = Math.floor(p[P_LAT] / CELL) + "_" + Math.floor(p[P_LNG] / CELL);

  for (var y = s; y <= n; y++) {

    if (showToasts) toast("Zoom in (level " + OSM_MIN_ZOOM + "+) to load OSM campsites.");
    return;
  }
  var b = m.getBounds();
  if (osmLastBounds && osmLastBounds.contains(b)) return;
  var q = "[out:json][timeout:25];nwr[\"tourism\"~\"^(camp_site|caravan_site)$\"](" +
    b.getSouth().toFixed(5) + "," + b.getWest().toFixed(5) + "," +
    b.getNorth().toFixed(5) + "," + b.getEast().toFixed(5) + ");out center 1500;";
  osmFetching = true;
  /* same multi-mirror helper the trail search uses, so a stalled Overpass
     server can't leave this hanging either */
  overpassJson("data=" + encodeURIComponent(q)).then(function (data) {
    osmFetching = false;
    osmLastBounds = b;
    var added = 0;
    (data.elements || []).forEach(function (el) {
      if (el.type !== "node" && el.center) { el.lat = el.center.lat; el.lon = el.center.lon; }
      if (typeof el.lat !== "number" || typeof el.lon !== "number") return;
      var key = el.type + el.id;
      if (!osmCamps[key]) { osmCamps[key] = el; added++; }
    });
    renderOsmMarkers();
    if (showToasts) toast("Loaded " + added + " new OSM campsites 🏕️");
  }).catch(function () {
    osmFetching = false;
    if (showToasts) toast("OSM server busy or offline — try again later.");
  });
}

var routeLayerTF = L.layerGroup().addTo(mapTF);

var routeGeom = null, routeSegs = null, routeBBox = null;
var corridorPlaces = null, corridorVersion = 0;

function corridorMiles() {
  return parseFloat(document.getElementById("routeCorridor").value) || 0;
}
function saveRoutePrefs() {

function geocodeOne(q) {
  var m = q.match(/^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/);
  if (m) return Promise.resolve([parseFloat(m[1]), parseFloat(m[2]), q]);
  var ql = q.toLowerCase();
  if (ql === "me" || ql === "my location" || ql === "here") {
    return new Promise(function (res, rej) {
      if (!navigator.geolocation) return rej(new Error("location not available"));
      navigator.geolocation.getCurrentPosition(function (pos) {
        res([pos.coords.latitude, pos.coords.longitude, "My location"]);
      }, function () { rej(new Error("couldn't get your location")); },
      { enableHighAccuracy: true, timeout: 12000 });
    });
  }
  return fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(q))
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (!res.length) throw new Error("“" + q + "” not found");
      return [parseFloat(res[0].lat), parseFloat(res[0].lon), res[0].display_name.split(",")[0]];
    });
}

/* exact coords remembered when a route field's suggestion is tapped */
var routePicked = {};
function resolvePoint(id, val) {
  var p = routePicked[id];
  if (p && p.label === val) return Promise.resolve([p.lat, p.lng, p.label]);
  return geocodeOne(val);
}

function abIcon(label, color) {
  return L.divIcon({
    className: "",
    html: '<div class="pin-ico" style="background:' + color + ';color:#fff;font-weight:700;font-size:14px">' + label + "</div>",
    iconSize: [26, 26], iconAnchor: [13, 13]
  });
}
function drawRoute(coords, a, b) {
  [routeLayerMain, routeLayerTF, routeLayerGM].forEach(function (lay) {
    lay.clearLayers();
    lay.addLayer(L.polyline(coords, { color: "#fff", weight: 9, opacity: 0.7 }));
    lay.addLayer(L.polyline(coords, { color: "#2962ff", weight: 5, opacity: 0.9 }));
    lay.addLayer(L.marker(a, { icon: abIcon("A", "#1b5e20") }));
    lay.addLayer(L.marker(b, { icon: abIcon("B", "#b71c1c") }));
  });
}
function clearRoute() {
  routeGeom = routeSegs = routeBBox = null;
  corridorPlaces = null; corridorVersion++;
  [routeLayerMain, routeLayerTF, routeLayerGM].forEach(function (l) { l.clearLayers(); });
  document.getElementById("routeInfo").textContent = "";
  renderMarkers(true);
}

/* sampled route segments in local km coordinates, for fast distance tests */
function buildSegs() {
  routeSegs = [];
  var step = Math.max(1, Math.floor(routeGeom.length / 400));
  var pts = [];
  for (var i = 0; i < routeGeom.length; i += step) pts.push(routeGeom[i]);
  if (pts[pts.length - 1] !== routeGeom[routeGeom.length - 1]) pts.push(routeGeom[routeGeom.length - 1]);
  for (var j = 0; j < pts.length - 1; j++) {
    var a = pts[j], b = pts[j + 1];
    var cos = Math.max(0.2, Math.cos((a[0] + b[0]) / 2 * Math.PI / 180));
    routeSegs.push({
      ax: a[1] * cos * 111.32, ay: a[0] * 111.32,
      bx: b[1] * cos * 111.32, by: b[0] * 111.32, cos: cos,
      minLat: Math.min(a[0], b[0]), maxLat: Math.max(a[0], b[0]),
      minLng: Math.min(a[1], b[1]), maxLng: Math.max(a[1], b[1])
    });
  }
  var mnLa = 90, mxLa = -90, mnLo = 180, mxLo = -180;
  for (var k = 0; k < routeGeom.length; k++) {
    var p = routeGeom[k];
    if (p[0] < mnLa) mnLa = p[0]; if (p[0] > mxLa) mxLa = p[0];
    if (p[1] < mnLo) mnLo = p[1]; if (p[1] > mxLo) mxLo = p[1];
  }
  routeBBox = [mnLa, mxLa, mnLo, mxLo];
}
function computeCorridor() {
  corridorVersion++;
  var mi = corridorMiles();
  if (!routeGeom || !mi) { corridorPlaces = null; return; }
  var rkm = mi * 1.60934;
  var latPad = rkm / 111.32;
  var cosMin = Math.max(0.2, Math.cos(Math.max(Math.abs(routeBBox[0]), Math.abs(routeBBox[1])) * Math.PI / 180));
  var lngPadG = rkm / (111.32 * cosMin);
  var mnLa = routeBBox[0] - latPad, mxLa = routeBBox[1] + latPad;
  var mnLo = routeBBox[2] - lngPadG, mxLo = routeBBox[3] + lngPadG;
  for (var s = 0; s < routeSegs.length; s++) routeSegs[s].lp = rkm / (111.32 * routeSegs[s].cos);
  var out = [];
  for (var i = 0; i < places.length; i++) {
    var p = places[i];
    var la = p[P_LAT], lo = p[P_LNG];
    if (la < mnLa || la > mxLa || lo < mnLo || lo > mxLo) continue;
    for (var j = 0; j < routeSegs.length; j++) {
      var sg = routeSegs[j];
      if (la < sg.minLat - latPad || la > sg.maxLat + latPad ||
          lo < sg.minLng - sg.lp || lo > sg.maxLng + sg.lp) continue;
      var px = lo * sg.cos * 111.32, py = la * 111.32;
      var dx = sg.bx - sg.ax, dy = sg.by - sg.ay;
      var t = ((px - sg.ax) * dx + (py - sg.ay) * dy) / ((dx * dx + dy * dy) || 1);
      if (t < 0) t = 0; else if (t > 1) t = 1;
      var qx = sg.ax + t * dx - px, qy = sg.ay + t * dy - py;
      if (qx * qx + qy * qy <= rkm * rkm) { out.push(p); break; }
    }
  }
  corridorPlaces = out;
}

document.getElementById("routeGo").addEventListener("click", function () {
  var s = document.getElementById("routeStart").value.trim();
  var e = document.getElementById("routeEnd").value.trim();
  if (!s || !e) return toast("Enter both a start and an end.");
  toast("Routing…");
  var A, B;
  resolvePoint("routeStart", s).then(function (a) { A = a; return resolvePoint("routeEnd", e); })
    .then(function (b) {
      B = b;
      return fetch("https://router.project-osrm.org/route/v1/driving/" +
        A[1] + "," + A[0] + ";" + B[1] + "," + B[0] + "?overview=full&geometries=geojson");
    })
    .then(function (r) { if (!r.ok) throw new Error("routing server " + r.status); return r.json(); })
    .then(function (data) {
      if (!data.routes || !data.routes.length) throw new Error("no route found");
      var rt = data.routes[0];
      routeGeom = rt.geometry.coordinates.map(function (c) { return [c[1], c[0]]; });
      buildSegs();
      drawRoute(routeGeom, [A[0], A[1]], [B[0], B[1]]);
      var hrs = Math.floor(rt.duration / 3600), mins = Math.round((rt.duration % 3600) / 60);
      document.getElementById("routeInfo").textContent =
        Math.round(rt.distance / 1609.34).toLocaleString() + " mi · " + hrs + "h" + (mins < 10 ? "0" : "") + mins;
      computeCorridor();
      activeMap().fitBounds(L.latLngBounds(routeGeom).pad(0.08));
      renderMarkers(true);
      saveRoutePrefs();
      toast("Route: " + A[2] + " → " + B[2]);
    })
    .catch(function (err) { toast("Routing failed: " + err.message); });
});
document.getElementById("routeCorridor").addEventListener("change", function () {
  computeCorridor();
  renderMarkers(true);
  saveRoutePrefs();
});

/* ---------------- location typeahead ----------------
   Suggests towns, parks, natural features and landmarks (Nominatim), plus
   matching bundled iOverlander places (works offline). */
var GEO_CLASSES = {
  place: 1, boundary: 1, natural: 1, leisure: 1, tourism: 1,
  historic: 1, waterway: 1, landuse: 1, mountain_pass: 1
};
/* Trail-ish results the geocoder can return. These come back for the whole
   world, so a trail well outside the current map view is still findable —
   Overpass only covers the area you're looking at. Street types are absent
   on purpose. */
var GEO_TRAIL_TYPES = { path: 1, track: 1, cycleway: 1, bridleway: 1, footway: 1 };
var GEO_ROUTE_TYPES = { mtb: 1, hiking: 1, bicycle: 1, foot: 1, horse: 1, ski: 1, piste: 1 };
function isTrailResult(r) {
  return (r.class === "highway" && GEO_TRAIL_TYPES[r.type]) ||
         (r.class === "route" && GEO_ROUTE_TYPES[r.type]);
}
var GEO_TYPE_ICON = {
  city: "🏙️", town: "🏘️", village: "🏘️", hamlet: "🏘️", municipality: "🏘️",
  suburb: "🏘️", locality: "📍", county: "🗺️", state: "🗺️", region: "🗺️",
  island: "🏝️", national_park: "🏞️", protected_area: "🏞️", nature_reserve: "🏞️",
  park: "🏞️", forest: "🌲", wood: "🌲", peak: "⛰️", volcano: "🌋", ridge: "⛰️",
  valley: "🏔️", cliff: "🧗", glacier: "🧊", water: "💧", bay: "🌊", beach: "🏖️",
  river: "💧", stream: "💧", waterfall: "💦", hot_spring: "♨️", desert: "🏜️",
  attraction: "📷", viewpoint: "👁️", camp_site: "🏕️", wilderness_hut: "🛖",
  museum: "🏛️", monument: "🗿", memorial: "🗿", ruins: "🏛️",
  archaeological_site: "🏺", castle: "🏰", mountain_pass: "🛤️"
};
function geoIcon(r) {
  return GEO_TYPE_ICON[r.type] || (r.class === "place" ? "🏘️" : "📍");
}
function splitName(dn) {
  var parts = (dn || "").split(",");
  return { name: parts[0].trim(), sub: parts.slice(1).join(",").trim() };
}
/* ---- OSM trail search (Overpass) ----
   Only trail-type ways and route relations are queried, so streets, addresses
   and other junk can't come back. Route relations are whole trail systems /
   long-distance routes; ways are individual named trails. */
var TRAIL_WAY_TYPES = "path|track|cycleway|bridleway|footway";
var TRAIL_ROUTE_TYPES = "mtb|hiking|bicycle|foot|horse|ski|piste";
function trailIcon(el) {
  var t = el.tags || {};
  if (t.route) {
    return { mtb: "🚵", bicycle: "🚴", hiking: "🥾", foot: "🥾",
             horse: "🐎", ski: "⛷️", piste: "⛷️" }[t.route] || "🚵";
  }
  return { cycleway: "🚵", path: "🥾", footway: "🥾",
           track: "🛤️", bridleway: "🐎" }[t.highway] || "🥾";
}
function rxEscape(s) { return s.replace(/[.*+?^${}()|[\]\\"]/g, "\\$&"); }
/* the public Overpass instance rate-limits and answers with an XML error page,
   so try mirrors in turn and never hand a non-JSON body to JSON.parse */
/* All must have worldwide coverage — a region-limited instance would answer
   quickly with zero results and look like "no trails found". */
var OVERPASS_HOSTS = [
  "https://overpass-api.de/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter",
  "https://overpass.private.coffee/api/interpreter",
  "https://maps.mail.ru/osm/tools/overpass/api/interpreter"
];
var trailCache = {};
/* Hedged requests: start with one mirror, and if it hasn't answered shortly,
   bring in the next as well — first valid JSON wins. A busy Overpass server
   will hold a connection open indefinitely, so a plain sequential fallback
   with no timeout can hang forever. */
function overpassJson(body, signal) {
  return new Promise(function (resolve, reject) {
    var settled = false, next = 0, failures = 0, acs = [];
    function cleanup() {
      acs.forEach(function (a) { try { a.abort(); } catch (e) {} });
    }
    if (signal) {
      if (signal.aborted) return reject(new Error("aborted"));
      signal.addEventListener("abort", function () {
        if (settled) return;
        settled = true; cleanup(); reject(new Error("aborted"));
      });
    }
    function launch() {
      if (settled || next >= OVERPASS_HOSTS.length) return;
      var host = OVERPASS_HOSTS[next++];
      var ac = new AbortController();
      acs.push(ac);
      var to = setTimeout(function () { try { ac.abort(); } catch (e) {} }, 12000);
      fetch(host, {
        method: "POST", signal: ac.signal,
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: body
      }).then(function (r) { return r.text(); }).then(function (txt) {
        clearTimeout(to);
        var t = txt.replace(/^﻿/, "").trim();
        if (t.charAt(0) !== "{") throw new Error("busy");  // XML error / rate limited
        if (settled) return;
        settled = true; cleanup(); resolve(JSON.parse(t));
      }).catch(function () {
        clearTimeout(to);
        if (settled) return;
        failures++;
        if (failures >= OVERPASS_HOSTS.length) { settled = true; reject(new Error("overpass unavailable")); }
        else launch();                                     // a mirror failed: try the next now
      });
    }
    launch();
    setTimeout(function () { if (!settled) launch(); }, 2000);
    setTimeout(function () { if (!settled) launch(); }, 4500);
    setTimeout(function () { if (!settled) launch(); }, 7000);
  });
}
function trailSuggest(q, signal) {
  var m = activeMap(), b = m.getBounds(), c = m.getCenter();
  var s = b.getSouth(), n = b.getNorth(), w = b.getWest(), e = b.getEast();
  /* Guarantee a real search area: when zoomed in tight — or if the map
     reports empty bounds because its container hasn't been sized yet — the
     box would collapse and Overpass would match nothing. Also cap it so a
     world view can't trigger a huge scan. */
  var MIN_SPAN = 0.7;   // ~75 km, so nearby trails still turn up
  if (!isFinite(n - s) || n - s < MIN_SPAN) { s = c.lat - MIN_SPAN / 2; n = c.lat + MIN_SPAN / 2; }
  if (!isFinite(e - w) || e - w < MIN_SPAN) { w = c.lng - MIN_SPAN / 2; e = c.lng + MIN_SPAN / 2; }
  if (n - s > 4) { s = c.lat - 2; n = c.lat + 2; }
  if (e - w > 4) { w = c.lng - 2; e = c.lng + 2; }
  var box = s.toFixed(4) + "," + w.toFixed(4) + "," + n.toFixed(4) + "," + e.toFixed(4);
  var rx = rxEscape(q);
  var ql =
    "[out:json][timeout:20];(" +
    'way["highway"~"^(' + TRAIL_WAY_TYPES + ')$"]["name"~"' + rx + '",i](' + box + ");" +
    'relation["route"~"^(' + TRAIL_ROUTE_TYPES + ')$"]["name"~"' + rx + '",i](' + box + ");" +
    ");out center 40;";
  var ck = q.toLowerCase() + "@" + box;
  if (trailCache[ck]) return Promise.resolve(trailCache[ck]);
  return overpassJson("data=" + encodeURIComponent(ql), signal).then(function (d) {
    var seen = {}, systems = [], singles = [];
    (d.elements || []).forEach(function (el) {
      var t = el.tags || {};
      if (!t.name) return;
      var key = t.name.toLowerCase();
      if (seen[key]) return;                       // a trail is many way segments
      seen[key] = 1;
      var lat = el.lat != null ? el.lat : (el.center && el.center.lat);
      var lng = el.lon != null ? el.lon : (el.center && el.center.lon);
      if (typeof lat !== "number" || typeof lng !== "number") return;
      var rec = {
        lat: lat, lng: lng, name: t.name, icon: trailIcon(el), trail: true,
        sub: el.type === "relation"
          ? "Trail system" + (t.route ? " · " + t.route : "")
          : "Trail" + (t.highway ? " · " + t.highway : "")
      };
      (el.type === "relation" ? systems : singles).push(rec);
    });
    var out = systems.concat(singles).slice(0, 6);  // whole systems first
    trailCache[ck] = out;
    return out;
  });
}

/* local (offline) matches from the bundled iOverlander data */
function localSuggest(q, max) {
  var ql = q.toLowerCase();
  var pre = [], sub = [];
  for (var i = 0; i < places.length; i++) {
    var p = places[i];
    var nl = p[P_NAME].toLowerCase();
    var idx = nl.indexOf(ql);
    if (idx === 0) { if (pre.length < max) pre.push(p); }
    else if (idx > 0) { if (sub.length < max) sub.push(p); }
    if (pre.length >= max) break;
  }
  return pre.concat(sub).slice(0, max).map(function (p) {
    return {
      lat: p[P_LAT], lng: p[P_LNG], name: p[P_NAME],
      sub: p[P_CAT] + " · saved place", icon: catIcon(p[P_CAT]), local: true
    };
  });
}

/* Absorb the ghost click that follows a tap on a dropdown row, so it can't
   trigger the header button that was sitting underneath the list. */
var swallowUntil = 0;
document.addEventListener("click", function (e) {
  if (Date.now() < swallowUntil) { e.preventDefault(); e.stopPropagation(); }
}, true);
function swallowClicks() { swallowUntil = Date.now() + 700; }

function attachAutocomplete(input, opts) {
  opts = opts || {};
  var list = document.createElement("div");
  list.className = "ac-list";
  document.body.appendChild(list);
  var items = [], sel = -1, timer = null, ctrl = null, lastQ = "";
  var touching = false, dragged = false, startX = 0, startY = 0;

  function place() {
    var r = input.getBoundingClientRect();
    var vv = window.visualViewport;
    var vw = (vv && vv.width) || window.innerWidth;
    var vh = (vv && vv.height) || window.innerHeight;
    var w = Math.min(Math.max(r.width, 260), vw - 12);
    var left = Math.min(r.left, vw - w - 6);
    list.style.left = Math.max(6, left) + "px";
    list.style.top = (r.bottom + 4) + "px";
    list.style.width = w + "px";
    /* Aim for 4 full rows plus a half-row peek; shrink only if the keyboard
       leaves less room than that. */
    var ROWS_SHOWN = 4;
    var room = Math.max(132, Math.min(vh - r.bottom - 10, vh * 0.8));
    var avail = room;
    var rowEl = list.querySelector(".ac-item");
    if (rowEl) {
      var rh = rowEl.getBoundingClientRect().height || 46;
      var noteEl = list.querySelector(".ac-note");
      var noteH = noteEl ? noteEl.getBoundingClientRect().height : 0;
      var contentH = noteH + rh * items.length;
      avail = Math.min(room, noteH + rh * (ROWS_SHOWN + 0.5));
      if (contentH <= avail) {
        avail = contentH;                       // everything fits: no peek needed
      } else {
        var full = Math.max(1, Math.floor((avail - noteH - rh * 0.5) / rh));
        avail = noteH + rh * (full + 0.5);      // land exactly on a half row
      }
    }
    list.style.maxHeight = Math.round(avail) + "px";
  }
  function updateFade() {
    var more = list.scrollHeight > list.clientHeight + 2 &&
               list.scrollTop + list.clientHeight < list.scrollHeight - 2;
    list.classList.toggle("more", more);
  }
  function close() { list.classList.remove("open"); sel = -1; }
  function render(note) {
    list.innerHTML = "";
    if (note) {
      var n = document.createElement("div");
      n.className = "ac-note"; n.textContent = note;
      list.appendChild(n);
    }
    items.forEach(function (it, i) {
      var row = document.createElement("div");
      row.className = "ac-item" + (i === sel ? " sel" : "");
      row.innerHTML = '<span class="ac-ico' + (it.local ? " local" : it.trail ? " trail" : "") + '">' + it.icon + "</span>" +
        '<span class="ac-txt"><span class="ac-name"></span><span class="ac-sub"></span></span>';
      row.querySelector(".ac-name").textContent = it.name;
      var subEl = row.querySelector(".ac-sub");
      if (it.sub) subEl.textContent = it.sub; else subEl.style.display = "none";
      list.appendChild(row);
    });
    if (items.length || note) {
      var fade = document.createElement("div");
      fade.className = "ac-fade";
      fade.textContent = "⌄";
      list.appendChild(fade);
      place();
      list.classList.add("open");
      updateFade();
    } else close();
  }
  function choose(i) {
    var it = items[i];
    if (!it) return;
    input.value = it.name;
    close();
    input.blur();
    opts.onPick(it);
  }
  function query(q) {
    var local = opts.local ? localSuggest(q, 3) : [];
    var trails = [], geo = [], done = 0;
    if (local.length) { items = local; render(); }
    if (ctrl) ctrl.abort();
    ctrl = new AbortController();
    var sig = ctrl.signal;

    function merge(waiting) {
      if (input.value.trim() !== q) return;      // user kept typing
      var seen = {};
      trails.forEach(function (t) { seen[t.name.toLowerCase()] = 1; });
      var geoDeduped = geo.filter(function (g) { return !seen[g.name.toLowerCase()]; });
      items = local.concat(trails, geoDeduped);
      render(items.length ? "" : (waiting ? "Searching…" : "No matches"));
    }

    var m = activeMap();
    var b = m.getBounds();
    var vb = "&viewbox=" + b.getWest().toFixed(3) + "," + b.getNorth().toFixed(3) + "," +
      b.getEast().toFixed(3) + "," + b.getSouth().toFixed(3) + "&bounded=0";
    fetch("https://nominatim.openstreetmap.org/search?format=json&limit=12&addressdetails=0" +
      vb + "&q=" + encodeURIComponent(q), { signal: sig })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        /* towns / parks / natural features, plus named trails anywhere in the
           world — never streets or addresses */
        geo = res.filter(function (r) { return GEO_CLASSES[r.class] || isTrailResult(r); })
          .slice(0, 7).map(function (r) {
            var s = splitName(r.display_name);
            var t = isTrailResult(r);
            return {
              lat: parseFloat(r.lat), lng: parseFloat(r.lon), name: s.name, sub: t ? "Trail · " + s.sub : s.sub,
              icon: t ? (r.class === "route" ? "🚵" : r.type === "track" ? "🛤️" : "🥾") : geoIcon(r),
              trail: t
            };
          });
      })
      .catch(function () {})
      .then(function () { done++; merge(done < 2); });

    /* named trails and trail systems near the current view — held back a beat
       longer, since Overpass is heavier than the geocoder */
    if (q.length >= 3) {
      setTimeout(function () {
        if (sig.aborted || input.value.trim() !== q) { done++; return; }
        trailSuggest(q, sig)
          .then(function (t) { trails = t; })
          .catch(function () {})
          .then(function () { done++; merge(done < 2); });
      }, 350);
    } else { done++; }
  }

  /* Distinguish a thumb-scroll from a tap: only fire on pointerup that didn't
     drag. Nothing calls preventDefault on pointerdown, so the list scrolls
     natively. */
  list.addEventListener("pointerdown", function (e) {
    touching = true; dragged = false; startX = e.clientX; startY = e.clientY;
  });
  list.addEventListener("pointermove", function (e) {
    if (touching && (Math.abs(e.clientY - startY) > 8 || Math.abs(e.clientX - startX) > 8)) dragged = true;
  });
  list.addEventListener("pointerup", function (e) {
    touching = false;
    if (dragged) return;                       // that was a scroll, not a tap
    var row = e.target.closest ? e.target.closest(".ac-item") : null;
    if (!row) return;
    /* Stop the browser's synthesized click: the list closes on selection, so
       that click would otherwise land on whatever header control sits beneath. */
    e.preventDefault();
    swallowClicks();
    var rows = Array.prototype.slice.call(list.querySelectorAll(".ac-item"));
    choose(rows.indexOf(row));
  });
  list.addEventListener("touchend", function (e) {
    if (!dragged && e.target.closest && e.target.closest(".ac-item")) e.preventDefault();
  });
  list.addEventListener("pointercancel", function () { touching = false; });
  list.addEventListener("scroll", updateFade);

  input.addEventListener("input", function () {
    var q = this.value.trim();
    clearTimeout(timer);
    if (q.length < 2) { items = []; close(); return; }
    if (q === lastQ) return;
    lastQ = q;
    timer = setTimeout(function () { query(q); }, 320);
  });
  /* No blur-based closing: touching the list to scroll blurs the input on
     mobile, and any timer race there can yank the list away mid-scroll.
     The outside-tap handler below closes it instead. */
  input.addEventListener("focus", function () { if (items.length) { place(); list.classList.add("open"); } });
  /* close when tapping anywhere outside the field and the list */
  document.addEventListener("pointerdown", function (e) {
    if (e.target === input || list.contains(e.target)) return;
    close();
  });
  window.addEventListener("resize", function () { if (list.classList.contains("open")) place(); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", function () {
      if (list.classList.contains("open")) place();
    });
  }

  /* capture phase so arrow/enter selection beats the field's own Enter handler */
  document.addEventListener("keydown", function (e) {
    if (e.target !== input || !list.classList.contains("open") || !items.length) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      sel = e.key === "ArrowDown"
        ? (sel + 1) % items.length
        : (sel <= 0 ? items.length - 1 : sel - 1);
      render();
      var el = list.children[sel + (list.querySelector(".ac-note") ? 1 : 0)];
      if (el && el.scrollIntoView) el.scrollIntoView({ block: "nearest" });
    } else if (e.key === "Enter" && sel >= 0) {
      e.preventDefault(); e.stopPropagation();
      choose(sel);
    } else if (e.key === "Escape") {
      close();
    }
  }, true);

  return { close: close };
}

/* search: local place names first, then geocode (network) */
document.getElementById("searchBox").addEventListener("keydown", function (e) {
  if (e.key !== "Enter" || !this.value.trim()) return;
  this.blur();
  var q = this.value.trim(), ql = q.toLowerCase();
  for (var i = 0; i < places.length; i++) {
    var p = places[i];
    if (activeCats && !activeCats.has(p[P_CAT])) continue;
    if (p[P_NAME].toLowerCase().indexOf(ql) !== -1) {
      var m = activeMap();
      m.setView([p[P_LAT], p[P_LNG]], Math.max(m.getZoom(), 13));
      if (currentView === "tf") syncTF(true);
      if (currentView === "gm") syncGM(true);
      renderMarkers(true);
      toast("📍 " + p[P_NAME]);
      return;
    }
  }
  fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(q))
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (!res.length) return toast("No results for “" + q + "”");
      var lat = parseFloat(res[0].lat), lng = parseFloat(res[0].lon);
      var m = activeMap();
      m.setView([lat, lng], 12);
      if (currentView === "tf") syncTF(true);
      if (currentView === "gm") syncGM(true);
    })
    .catch(function () { toast("No local match; place search needs network."); });
});

/* wire the typeahead to the three location fields */
attachAutocomplete(document.getElementById("searchBox"), {
  local: true,
  onPick: function (it) {
    var m = activeMap();
    m.setView([it.lat, it.lng], Math.max(m.getZoom(), it.local ? 14 : 12));
    if (currentView === "tf") syncTF(true);
    if (currentView === "gm") syncGM(true);
    renderMarkers(true);
    toast("📍 " + it.name);
  }
});
["routeStart", "routeEnd"].forEach(function (id) {
  attachAutocomplete(document.getElementById(id), {
    local: false,
    onPick: function (it) {
      routePicked[id] = { label: it.name, lat: it.lat, lng: it.lng };
      saveRoutePrefs();
    }
  });
});

var toastTimer = null;
function toast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.style.display = "none"; }, 5000);
}

/* ---------------- service worker ---------------- */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}

/* ---------------- boot ---------------- */
loadCats();
loadBundledData().then(function () {
  setLoad("Rendering…", 1);
  try {
    var pos = JSON.parse(localStorage.getItem(POS_KEY));
    if (pos && isFinite(pos[0])) {
      mapMain.setView([pos[0], pos[1]], pos[2], { animate: false });
      mapTF.setView([pos[0], pos[1]], pos[2], { animate: false });
      mapGM.setView([pos[0], pos[1]], pos[2], { animate: false });
    }
  } catch (e) {}
  refreshAll();
  showView("tf"); // always open on the Trailforks view
  document.getElementById("loading").style.display = "none";
}).catch(function (err) {
  setLoad("Failed to load place data: " + err.message + " — check connection and reload.", 0);
});
</script>
</body>
</html>
